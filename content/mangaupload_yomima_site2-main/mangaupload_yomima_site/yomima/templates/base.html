<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}よみま{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

<header class="site-header">
  <div class="container">
    <div class="inner" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem;">
      <div style="display:flex;align-items:baseline;gap:1rem;">
        <a href="/" class="site-title">よみ<span>ま</span></a>
        <span class="site-sub">manga reader // zip · cbz · rar · cbr</span>
      </div>
      <nav style="display:flex;gap:.75rem;align-items:center;">
        <a href="/public" id="nav-public"  class="btn btn-sm btn-ghost">📖 公開作品</a>
        <a href="/"       id="nav-mylist" class="btn btn-sm btn-ghost">📚 マイリスト</a>
      </nav>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.45rem 0;font-size:.85rem">
      <span style="color:#94a3b8">読者アカウント:</span>
      <span id="auth-state">確認中…</span>
      <span id="auth-forms" style="display:none;gap:.4rem;align-items:center;flex-wrap:wrap">
        <input class="input" id="auth-user" type="text" placeholder="ユーザー名" style="width:9rem">
        <input class="input" id="auth-email" type="email" placeholder="メール（登録時のみ）" style="width:11rem">
        <input class="input" id="auth-pass" type="password" placeholder="パスワード" style="width:9rem">
        <button class="btn btn-sm btn-primary" onclick="viewerLogin()">ログイン</button>
        <button class="btn btn-sm btn-ghost" onclick="viewerRegister()">新規登録</button>
      </span>
      <button id="auth-logout" class="btn btn-sm btn-ghost" style="display:none" onclick="viewerLogout()">ログアウト</button>
      <button id="auth-declare" class="btn btn-sm btn-ghost" style="display:none" onclick="viewerDeclareAdult()">年齢申告（18歳以上）</button>
      <span id="auth-msg" style="color:#dc2626"></span>
    </div>
  </div>
</header>

<main class="container page-enter">
  {% block content %}{% endblock %}
</main>

<script>
function authMsg(text) { document.getElementById('auth-msg').textContent = text || ''; }
async function refreshAuthArea() {
  const state = document.getElementById('auth-state');
  const forms = document.getElementById('auth-forms');
  const logoutBtn = document.getElementById('auth-logout');
  const declareBtn = document.getElementById('auth-declare');
  try {
    const r = await fetch('/auth/me');
    if (r.ok) {
      const me = await r.json();
      state.textContent = '👤 ' + me.username + ' でログイン中';
      forms.style.display = 'none';
      logoutBtn.style.display = '';
      declareBtn.style.display = '';
      if (me.adult_declared_at) {
        declareBtn.textContent = '年齢申告済み';
        declareBtn.disabled = true;
      } else {
        declareBtn.textContent = '年齢申告（18歳以上）';
        declareBtn.disabled = false;
      }
    } else {
      state.textContent = '未ログイン';
      forms.style.display = 'inline-flex';
      logoutBtn.style.display = 'none';
      declareBtn.style.display = 'none';
    }
  } catch(e) {
    state.textContent = '';
    forms.style.display = 'inline-flex';
  }
}
async function postAuth(path, fields) {
  const fd = new FormData();
  for (const k in fields) fd.append(k, fields[k]);
  const r = await fetch(path, { method: 'POST', body: fd });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || '失敗しました');
  return d;
}
async function viewerLogin() {
  authMsg('');
  try {
    await postAuth('/auth/login', {
      username: document.getElementById('auth-user').value,
      password: document.getElementById('auth-pass').value,
    });
    location.reload();
  } catch(e) { authMsg(e.message); }
}
async function viewerRegister() {
  authMsg('');
  const email = document.getElementById('auth-email').value.trim();
  if (!email) { authMsg('登録にはメールアドレスも入力してください'); return; }
  try {
    await postAuth('/auth/register', {
      username: document.getElementById('auth-user').value,
      email: email,
      password: document.getElementById('auth-pass').value,
    });
    location.reload();
  } catch(e) { authMsg(e.message); }
}
async function viewerDeclareAdult() {
  authMsg('');
  try {
    const r = await fetch('/auth/declare-adult', { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || '年齢申告に失敗しました');
    authMsg('年齢申告を記録しました');
    refreshAuthArea();
  } catch(e) { authMsg(e.message); }
}
async function viewerLogout() {
  try { await fetch('/auth/logout', { method: 'POST' }); } catch(e) {}
  location.reload();
}
refreshAuthArea();
</script>
</body>
</html>
